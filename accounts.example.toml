# 复制为 accounts.toml，或使用 accountctl init + add / import-1password。
# accounts.toml 与 .account-workspaces/ 默认不会提交到 Git。
version = 1
state_dir = ".account-workspaces"

[defaults]
urls = ["about:blank"]

[defaults.browser]
window = [1440, 900]
# 位置信号默认每次启动前从代理的真实出口重新推导（egress = "auto"）：
# 时区、语言、地理坐标、WebRTC IP、Accept-Language 全部跟着出口走。
# proxy = "http://127.0.0.1:7890"    # 无密码代理
# proxy_ref = "env://BROWSER_PROXY" # 带认证信息的代理只允许引用
# egress = "auto"                   # auto | strict | warn | off
# webrtc = "spoof"                  # spoof | block | keep
# probe_url = "https://ipinfo.io/json"
# 分流代理（mode: rule）下把 probe_url 指到被同一规则送到目标节点的域名，
# 否则探测与目标站点可能走不同出口。详见 README。

[[accounts]]
id = "google-personal"
label = "Google · Personal"
provider = "google"
tags = ["google", "personal"]
urls = ["https://accounts.google.com/", "https://mail.google.com/"]

[accounts.credentials]
username_ref = "op://Private/google-personal/username"
password_ref = "op://Private/google-personal/password"
# op_account = "my.1password.com"

[[accounts]]
id = "google-work"
label = "Google · Work"
provider = "google"
tags = ["google", "work"]
urls = ["https://accounts.google.com/"]

[accounts.browser]
window = [1600, 1000]
# 固定值仍然可以写；启动时会校验它们与出口国家/时区一致，不一致就拒绝启动。
# locale = "en-US"
# timezone = "America/New_York"

[accounts.credentials]
username_ref = "op://Work/google-work/username"
password_ref = "op://Work/google-work/password"

[[accounts]]
id = "custom-service"
label = "任意网站账号"
provider = "custom"
tags = ["personal"]
urls = ["https://example.com/"]
