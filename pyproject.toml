[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "account-workspaces"
version = "0.1.0"
description = "Configurable, isolated browser workspaces for multiple accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "camoufox[geoip]==0.4.11",
  "browserforge==1.2.4",
  "playwright==1.58.0",
  "portalocker>=3.2,<4",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
accountctl = "account_workspaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: opt-in real browser integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
